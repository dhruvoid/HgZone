services:

  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: hg_zone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend

    ports:
      - "8080:8080"

    depends_on:
      - postgres

volumes:
  postgres-data: