spring:
  application:
    name: HgZone
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/hg_zone?options=-c%20TimeZone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

flyway:
  enabled: true

jwt:
  secret: 8xVnM2QpL7sR9wYcH4dEfK6tUzJ3aBxN5mQ8vLpR2sX7zYcF9w
  access-token-expiration: 900000
